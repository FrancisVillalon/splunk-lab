services:
  splunk:
    image: splunk/splunk:10.4.0
    container_name: splunk
    hostname: splunk
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "sudo mkdir -p /opt/splunk/var/run/splunk/kvstore_upgrade && sudo rm -f /opt/splunk/var/run/splunk/kvstore_upgrade/versionFile42 && sudo touch /opt/splunk/var/run/splunk/kvstore_upgrade/versionFile80 && sudo chown -R splunk:splunk /opt/splunk/var/run/splunk/kvstore_upgrade && sudo ln -sfn mongod-8.0 /opt/splunk/bin/mongod && exec /sbin/entrypoint.sh \"$0\" \"$@\"", "start-service"]
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8089:8089"
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 20480
    volumes:
      - /opt/docker/splunk/etc/:/opt/splunk/etc
      - /opt/docker/splunk/var/lib/splunk:/opt/splunk/var/lib/splunk
