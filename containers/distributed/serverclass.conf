[serverClass:all_host]
machineTypesFilter = linux-x86_64
whitelist.0 = idx*
whitelist.1 = sh*
whitelist.3 = hf*
blacklist.0 = ds1
blacklist.1 = uf*

[serverClass:all_host:app:license_peer_config]
restartSplunkd = true
stateOnClient = enabled

[serverClass:indexer]
machineTypesFilter = linux-x86_64
whitelist.0 = idx*

[serverClass:indexer:app:1_all_indexes]
restartSplunkd = true
stateOnClient = enabled

[serverClass:indexer:app:1_indexer_base]
restartSplunkd = true
stateOnClient = enabled

[serverClass:indexer:app:receiving_config]
restartSplunkd = true
stateOnClient = enabled

[serverClass:forwarder]
machineTypesFilter = linux-x86_64
whitelist.0 = uf*

[serverClass:forwarder:app:flog_forwarder_inputs]
restartSplunkd = true
stateOnClient = enabled

[serverClass:forwarder:app:1_uf_outputs_to_hf]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder]
machineTypesFilter = linux-x86_64
whitelist.0 = hf*

[serverClass:heavy_forwarder:app:receiving_config]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:1_all_outputs_to_indexers]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:1_hf_outputs]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:flog_props_index]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:splunk_ingest_actions]
restartSplunkd = true
stateOnClient = enabled

[serverClass:search_heads]
whitelist.0 = sh*

[serverClass:search_heads:app:all_web_base]
restartSplunkd = true
stateOnClient = enabled

[serverClass:search_heads:app:flog_props_search]
restartSplunkd = true
stateOnClient = enabled

[serverClass:search_heads:app:1_all_outputs_to_indexers]
restartSplunkd = true
stateOnClient = enabled

# ds1's ingest actions UI auto-creates this class (whitelist = *). Blacklist overrides it; hf1 gets the app via heavy_forwarder.
[serverClass:100_IngestAction_AutoGenerated]
blacklist.0 = *
