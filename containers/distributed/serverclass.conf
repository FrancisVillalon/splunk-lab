# =============================================================================
# all_host: every full instance (idx, sh, hf), not ds or uf
# =============================================================================
[serverClass:all_host]
machineTypesFilter = linux-x86_64
whitelist.0 = idx*
whitelist.1 = sh*
whitelist.2 = hf*
blacklist.0 = ds*
blacklist.1 = uf*

# License peer config
[serverClass:all_host:app:all_license_peer]
restartSplunkd = true
stateOnClient = enabled

# =============================================================================
# indexer: indexes, base config and the S2S receiver
# =============================================================================
[serverClass:indexer]
machineTypesFilter = linux-x86_64
whitelist.0 = idx*

[serverClass:indexer:app:all_indexes]
restartSplunkd = true
stateOnClient = enabled

[serverClass:indexer:app:all_indexer_base]
restartSplunkd = true
stateOnClient = enabled

# Plain splunktcp receiver (9997)
[serverClass:indexer:app:all_receiving]
restartSplunkd = true
stateOnClient = enabled

# =============================================================================
# forwarder: universal forwarders, flog inputs, SSL output to hf
# =============================================================================
[serverClass:forwarder]
machineTypesFilter = linux-x86_64
whitelist.0 = uf*

[serverClass:forwarder:app:flog_inputs]
restartSplunkd = true
stateOnClient = enabled

# SSL output to hf1:9997
[serverClass:forwarder:app:uf_outputs_to_hf]
restartSplunkd = true
stateOnClient = enabled

# Trust splunk-lab-ca (server.conf sslRootCAPath)
[serverClass:forwarder:app:all_ssl_trust]
restartSplunkd = true
stateOnClient = enabled

# =============================================================================
# host_uf1: uf1's own client cert
# =============================================================================
[serverClass:host_uf1]
machineTypesFilter = linux-x86_64
whitelist.0 = uf1

[serverClass:host_uf1:app:uf1_ssl]
restartSplunkd = true
stateOnClient = enabled

# =============================================================================
# host_hf1: hf1's own server cert and SSL receiver
# =============================================================================
[serverClass:host_hf1]
machineTypesFilter = linux-x86_64
whitelist.0 = hf1

[serverClass:host_hf1:app:hf1_ssl]
restartSplunkd = true
stateOnClient = enabled

# =============================================================================
# heavy_forwarder: parsing, HEC and script inputs, output to idx
# =============================================================================
[serverClass:heavy_forwarder]
machineTypesFilter = linux-x86_64
whitelist.0 = hf*

[serverClass:heavy_forwarder:app:all_outputs_to_idx]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:hf_outputs]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:flog_props_index]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:splunk_ingest_actions]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:all_web_base]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:pythonLogGen_inputs]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:pythonLogGen_props_index]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:healthCheck_inputs]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:healthCheck_props_index]
restartSplunkd = true
stateOnClient = enabled

[serverClass:heavy_forwarder:app:hf_hec]
restartSplunkd = true
stateOnClient = enabled

# Receives Caddy logs over HEC
[serverClass:heavy_forwarder:app:caddy_inputs]
restartSplunkd = true
stateOnClient = enabled

# pass4SymmKey for deployment
[serverClass:heavy_forwarder:app:all_deployment_key]
restartSplunkd = true
stateOnClient = enabled

# =============================================================================
# search_heads: search-time props, web base, output to idx
# =============================================================================
[serverClass:search_heads]
whitelist.0 = sh*

[serverClass:search_heads:app:all_web_base]
restartSplunkd = true
stateOnClient = enabled

[serverClass:search_heads:app:flog_props_search]
restartSplunkd = true
stateOnClient = enabled

[serverClass:search_heads:app:caddy_props_search]
restartSplunkd = true
stateOnClient = enabled

[serverClass:search_heads:app:all_outputs_to_idx]
restartSplunkd = true
stateOnClient = enabled

[serverClass:search_heads:app:sh_ldap_auth]
restartSplunkd = true
stateOnClient = enabled

[serverClass:search_heads:app:sh_roles]
restartSplunkd = true
stateOnClient = enabled

[serverClass:search_heads:app:sh_ldap_rolemap]
restartSplunkd = true
stateOnClient = enabled

# =============================================================================
# 100_IngestAction_AutoGenerated
# Ingest actions should only go on the heavy forwarders.
# Overrides the auto-generated one.
# =============================================================================
[serverClass:100_IngestAction_AutoGenerated]
whitelist.0 = hf*
