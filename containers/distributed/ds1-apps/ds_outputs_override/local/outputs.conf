# Keep deployment-server telemetry local to ds1.
# SplunkDeploymentServerConfig/default/outputs.conf appends _dsclient, _dsphonehome and _dsappevent to the forward whitelist at forwardedindex.2
# Check using splunk btool outputs list --debug | grep _ds*
#
#
# Forwarding them blinds ds1's own forwarder management UI, which is search-backed off those indexes and has no search peer to fall back on.
# This casues sh1 to show the deployment clients instead.
# The fix is to blacklist the _ds* indexes from being forwarded and keep it local.
#
# The filter chain is numbered and must be continuous. Check what number it is at on ds1 through 
# splunk btool outputs list --debug | grep forwardedindex
#
#
# _internal and everything else still forward to idx1 as normal.
[tcpout]
forwardedindex.3.blacklist = _ds.*

# Adding outputs.conf turns local indexing off, so anything the filter chain drops
# gets discarded instead of kept. Blacklisting _ds* on its own just throws it away.
# This turns local indexing back on so the _ds* data actually stays on ds1.
[indexAndForward]
index = true
