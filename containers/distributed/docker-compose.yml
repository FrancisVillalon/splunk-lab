# Shared blocks, reused below via YAML anchors
x-splunk-env: &splunk-env
  TZ: Asia/Singapore
  SPLUNK_START_ARGS: --accept-license
  SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
  SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
  SPLUNK_PASS4SYMMKEY: ${SPLUNK_PASS4SYMMKEY}

x-splunk-server: &splunk-server
  image: splunk/splunk:10.4.2
  restart: unless-stopped
  stop_grace_period: 5m
  networks:
    - splunknet
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
    nproc: 20480
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 8G

networks:
  splunknet:
    driver: bridge

volumes:
  flog-logs:
  sh1-etc:
  sh1-var:
  uf1-etc:
  hf1-etc:
  hf1-var:
  ds1-etc:
  ds1-var:
  idx1-etc:
  idx1-var:
  caddy_data:
  caddy_config:
  splunk-etc:
    external: true
  splunk-var:
    external: true

services:
  # Utility services
  copier:
    image: alpine
    profiles: ["tools"]
    volumes:
      - splunk-etc:/from/etc:ro
      - splunk-var:/from/var:ro
      - idx1-etc:/to/etc
      - idx1-var:/to/var
    command: sh -c 'cp -a /from/etc/. /to/etc/; cp -a /from/var/. /to/var/'

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    networks:
      - splunknet
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - $PWD/caddy_conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ds1:
        condition: service_started
      sh1:
        condition: service_started
      hf1:
        condition: service_healthy
    logging:
      driver: splunk
      options:
        splunk-url: "https://127.0.0.1:8088"
        splunk-token: ${CADDY_HEC_TOKEN}
        splunk-format: "json"
        splunk-insecureskipverify: "true"
        splunk-verify-connection: "false"

  # Log generators
  flog:
    image: mingrammer/flog
    container_name: flog
    # -f json -> log format
    # -t log -> output type
    # -o /var/log/flog/access.log  -> output filename
    # -w -> overwrite existing log files
    # -l -> loop output indefinitely until killed
    # -d 20s -> delay log generation speed, defaults to seconds
    command:
      [
        "-f",
        "json",
        "-t",
        "log",
        "-o",
        "/var/log/flog/access.log",
        "-w",
        "-l",
        "-d",
        "2s",
      ]
    volumes:
      - flog-logs:/var/log/flog
    networks:
      - splunknet

  pythonLogGen:
    image: python:3.12-slim
    container_name: pythonLogGen
    command: python -u /app/gen.py
    volumes:
      - $PWD/pythonLogGen/:/app
    environment:
      TARGET: hf1
      PORT: "5514"
      PROTO: udp
    restart: unless-stopped
    networks:
      - splunknet
    depends_on:
      - hf1

  # Splunk lab services
  # uf -> Universal Forwarder
  # hf -> Heavy Forwarder
  # idx -> Indexer
  # sh -> Search Head
  # ds -> Deployment Server
  uf1:
    image: splunk/universalforwarder:10.4.2
    container_name: uf1
    hostname: uf1
    environment:
      <<: *splunk-env
      SPLUNK_DEPLOYMENT_SERVER: ds1
    volumes:
      - flog-logs:/var/log/flog:ro
      - uf1-etc:/opt/splunkforwarder/etc
    depends_on:
      - flog
      - hf1
    networks:
      - splunknet

  idx1:
    <<: *splunk-server
    container_name: idx1
    hostname: idx1
    environment:
      <<: *splunk-env
      SPLUNK_DEPLOYMENT_SERVER: ds1
    volumes:
      - idx1-etc:/opt/splunk/etc
      - idx1-var:/opt/splunk/var
    depends_on:
      - ds1

  ds1:
    <<: *splunk-server
    container_name: ds1
    hostname: ds1
    environment:
      <<: *splunk-env
    volumes:
      - ds1-etc:/opt/splunk/etc
      - ds1-var:/opt/splunk/var

  sh1:
    <<: *splunk-server
    container_name: sh1
    hostname: sh1
    environment:
      <<: *splunk-env
      SPLUNK_DEPLOYMENT_SERVER: ds1
    volumes:
      - sh1-etc:/opt/splunk/etc
      - sh1-var:/opt/splunk/var
    depends_on:
      - idx1
      - ds1

  hf1:
    <<: *splunk-server
    container_name: hf1
    hostname: hf1
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      <<: *splunk-env
      SPLUNK_DEPLOYMENT_SERVER: ds1
    volumes:
      - hf1-etc:/opt/splunk/etc
      - hf1-var:/opt/splunk/var
    depends_on:
      - idx1
      - ds1
