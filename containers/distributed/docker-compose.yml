networks:
  splunknet:
    driver: bridge

volumes:
  flog-logs:
  sh1-etc:
  sh1-var:
  uf1-etc:
  ds1-etc:
  ds1-var:
  idx1-etc:
  idx1-var:
  splunk-etc:
    external: true
  splunk-var:
    external: true

services:
  copier:
    image: alpine
    profiles: ["tools"]
    volumes:
      - splunk-etc:/from/etc:ro
      - splunk-var:/from/var:ro
      - idx1-etc:/to/etc
      - idx1-var:/to/var
    command: sh -c 'cp -a /from/etc/. /to/etc/; cp -a /from/var/. /to/var/'

  flog:
    image: mingrammer/flog
    container_name: flog
    # -f json -> log format
    # -t log -> output type
    # -o /var/log/flog/access.log  -> output filename
    # -w -> overwrite existing log files
    # -l -> loop output indefinitely until killed
    # -d 20s -> delay log generation speed, defaults to seconds
    command:
      [
        "-f",
        "json",
        "-t",
        "log",
        "-o",
        "/var/log/flog/access.log",
        "-w",
        "-l",
        "-d",
        "20s",
      ]
    volumes:
      - flog-logs:/var/log/flog
    networks:
      - splunknet

  uf1:
    image: splunk/universalforwarder:10.4.2
    container_name: uf1
    hostname: uf1
    environment:
      TZ: Asia/Singapore
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_DEPLOYMENT_SERVER: ds1
    volumes:
      - flog-logs:/var/log/flog:ro
      - uf1-etc:/opt/splunkforwarder/etc
    depends_on:
      - flog
      - idx1
      - ds1
    networks:
      - splunknet

  idx1:
    image: splunk/splunk:10.4.2
    container_name: idx1
    hostname: idx1
    restart: unless-stopped
    stop_grace_period: 5m
    ports:
      - "9997:9997"
    networks:
      - splunknet
    environment:
      TZ: Asia/Singapore
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_ENABLE_LISTEN: 9997
      SPLUNK_DEPLOYMENT_SERVER: ds1
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 20480
    volumes:
      - idx1-etc:/opt/splunk/etc
      - idx1-var:/opt/splunk/var
      - ./default.yml:/tmp/defaults/default.yml
    depends_on:
      - ds1
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8G

  ds1:
    image: splunk/splunk:10.4.2
    container_name: ds1
    hostname: ds1
    restart: unless-stopped
    stop_grace_period: 5m
    ports:
      - "8001:8000"
      - "8089:8089"
    networks:
      - splunknet
    environment:
      TZ: Asia/Singapore
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 20480
    volumes:
      - ds1-etc:/opt/splunk/etc
      - ds1-var:/opt/splunk/var
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8G

  sh1:
    image: splunk/splunk:10.4.2
    container_name: sh1
    hostname: sh1
    restart: unless-stopped
    stop_grace_period: 5m
    ports:
      - "8002:8000"
    networks:
      - splunknet
    environment:
      TZ: Asia/Singapore
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 20480
    volumes:
      - sh1-etc:/opt/splunk/etc
      - sh1-var:/opt/splunk/var
    depends_on:
      - idx1
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8G
